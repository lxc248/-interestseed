name: Release InterestSeed

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and release'
        required: true
        default: 'v3.7.0'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run verify

      - name: Package plugin
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          mkdir -p release
          cd dist
          zip -r "../release/interestseed-${RELEASE_TAG}.zip" main.js manifest.json styles.css

      - name: Package Agent Skill and Cosmic Viewer
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          mkdir -p release/skill/interestseed-skill
          cp -r skill/. release/skill/interestseed-skill/
          cp -r viewer release/skill/interestseed-skill/viewer
          cd release/skill
          zip -r "../interestseed-skill-${RELEASE_TAG}.zip" interestseed-skill


      - name: Generate release checksums
        run: |
          cd release
          sha256sum interestseed-v*.zip interestseed-skill-*.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Attest release provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/interestseed-v*.zip
            release/interestseed-skill-*.zip
            release/SHA256SUMS.txt

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          NOTES="RELEASE_NOTES_${RELEASE_TAG#v}.md"
          if [ ! -f "$NOTES" ]; then
            echo "Missing release notes: $NOTES"
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --notes-file "$NOTES"
          else
            gh release create "$RELEASE_TAG" --title "InterestSeed ${RELEASE_TAG#v}" --notes-file "$NOTES"
          fi
          gh release upload "$RELEASE_TAG" \
            release/interestseed-v*.zip \
            release/interestseed-skill-*.zip \
            release/SHA256SUMS.txt \
            assets/interestseed-launch.mp4 \
            assets/interestseed-launch-cover.png \
            assets/cosmic-viewer.png \
            assets/plugin-cosmic.png
