name: Release InterestSeed

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and release'
        required: true
        default: 'v3.7.0'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run verify

      - name: Package plugin
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          mkdir -p release
          cd dist
          zip -r "../release/interestseed-${RELEASE_TAG}.zip" main.js manifest.json styles.css

      - name: Package Agent Skill and Cosmic Viewer
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          mkdir -p release/skill/interestseed-skill
          cp -r skill/. release/skill/interestseed-skill/
          cp -r viewer release/skill/interestseed-skill/viewer
          cd release/skill
          zip -r "../interestseed-skill-${RELEASE_TAG}.zip" interestseed-skill


      - name: Generate release checksums
        run: |
          cd release
          sha256sum interestseed-*.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Attest release provenance
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: |
            release/interestseed-*.zip
            release/SHA256SUMS.txt

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          NOTES="RELEASE_NOTES_${RELEASE_TAG#v}.md"
          if [ ! -f "$NOTES" ]; then
            echo "Missing release notes: $NOTES"
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --notes-file "$NOTES"
          else
            gh release create "$RELEASE_TAG" --title "InterestSeed ${RELEASE_TAG#v}" --notes-file "$NOTES"
          fi
          # Obsidian 社区目录要求 release 里直接有 main.js / manifest.json / styles.css 三个资产。
          gh release upload "$RELEASE_TAG" --clobber \
            release/interestseed-*.zip \
            release/interestseed-skill-*.zip \
            release/SHA256SUMS.txt \
            dist/main.js \
            dist/manifest.json \
            dist/styles.css \
            assets/interestseed-launch.mp4 \
            assets/interestseed-launch-cover.png \
            assets/cosmic-viewer.png \
            assets/plugin-cosmic.png
