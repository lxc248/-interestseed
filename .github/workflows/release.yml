name: Release InterestSeed

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci
      - run: npm run verify

      - name: Package plugin
        run: |
          mkdir -p release
          cd dist
          zip -r "../release/interestseed-${GITHUB_REF_NAME}.zip" main.js manifest.json styles.css

      - uses: softprops/action-gh-release@v2
        with:
          files: release/interestseed-*.zip
          generate_release_notes: true
