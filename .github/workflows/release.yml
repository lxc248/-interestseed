name: Release InterestSeed

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and release'
        required: true
        default: 'v1.7.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci
      - run: npm run verify

      - name: Package plugin
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          mkdir -p release
          cd dist
          zip -r "../release/interestseed-${RELEASE_TAG}.zip" main.js manifest.json styles.css

      - name: Package Agent Skill and Cosmic Viewer
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          mkdir -p release/skill/interestseed-skill
          cp -r skill/. release/skill/interestseed-skill/
          cp -r viewer release/skill/interestseed-skill/viewer
          cd release/skill
          zip -r "../interestseed-skill-${RELEASE_TAG}.zip" interestseed-skill

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          body_path: RELEASE_NOTES_1.7.0.md
          files: |
            release/interestseed-v*.zip
            release/interestseed-skill-*.zip
            assets/interestseed-launch.mp4
            assets/interestseed-launch-cover.png
            assets/cosmic-viewer.png
            assets/plugin-cosmic.png
