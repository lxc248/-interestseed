name: Copy monitor

on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '22'

      - name: Search public GitHub metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/monitor-copies.mjs

      - name: Publish report to the job summary
        run: cat review/copy-monitor-latest.md >> "$GITHUB_STEP_SUMMARY"

      - name: Open an issue on a high-signal hit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if grep -q '^High findings: [1-9]' review/copy-monitor-latest.md; then
            gh issue create \
              --title "Copy monitor: high-signal hit $(date -u +%F)" \
              --body-file review/copy-monitor-latest.md
          fi
