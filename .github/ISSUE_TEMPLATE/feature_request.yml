name: Feature request
description: Propose a product or engineering improvement.
title: "[feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        InterestSeed is intentionally small and local-first. Proposals should
        preserve explicit user decisions and avoid automatic graph writes.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should happen, from the user's point of view?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Capture / Share Inbox
        - Graph / Canvas
        - Experiment / Review
        - Discovery / Audit
        - Share cards / Export
        - MCP / Integration
        - Accessibility
        - Performance
        - Documentation
        - Other
    validations:
      required: true
  - type: checkboxes
    id: invariants
    attributes:
      label: Product invariants
      options:
        - label: This keeps the user in control and does not auto-write the graph.
          required: true
        - label: This works locally without an account or model key, or explains why it cannot.
          required: true
